[project]
name = "tradbot"
version = "0.1.0"
description = "Bot de trading modulaire — crypto via ccxt"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.53",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tradbot*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
